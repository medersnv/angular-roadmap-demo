<div class="layout">
  <aside class="sidebar">
    <a routerLink="/" class="sidebar-header" aria-label="На главную">
      <span class="logo">A</span>
      <div>
        <h1>Angular Roadmap Demo</h1>
        <p>Learning Angular</p>
      </div>
    </a>

    <nav class="sidebar-nav">
      <a
        routerLink="/artifacts"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-artifacts"
      >
        <span class="nav-artifacts-text">
          <span class="nav-artifacts-label">Артефакты</span>
          <span class="nav-artifacts-subtitle">Файлы презентаций</span>
        </span>
      </a>

      @for (group of navGroups; track group.name) {
        <section class="nav-group" [class.expanded]="isExpanded(group.name)">
          <button
            type="button"
            class="nav-group-toggle"
            [attr.aria-expanded]="isExpanded(group.name)"
            (click)="toggleGroup(group.name)"
          >
            <span class="nav-group-title">{{ group.name }}</span>
            <span class="nav-group-chevron" aria-hidden="true"></span>
          </button>

          @if (isExpanded(group.name)) {
            <ul>
              @for (item of group.items; track item.path) {
                <li>
                  <a
                    [routerLink]="item.path"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: true }"
                    class="nav-link"
                    [class.nav-link-ready]="item.ready"
                  >
                    <span class="nav-label">{{ item.label }}</span>
                    <span class="nav-subtitle">{{ item.subtitle }}</span>
                  </a>
                </li>
              }
            </ul>
          }
        </section>
      }
    </nav>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
